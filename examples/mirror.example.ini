#
# A sample Mirror config. Run it with:
#
#     python examples/mirror.py examples/mirror.example.ini
#
# then point any Oracle client at 127.0.0.1:1521 (user PYO / password pyo123,
# service name anything) and run real SQL against the backend below.

[server]
host = 127.0.0.1
port = 1521

# Oracle-client logins the Mirror accepts. Usernames are matched
# case-insensitively (Oracle folds them to upper-case); passwords are the
# O5LOGON secrets the mutual auth needs.
[clients]
PYO = pyo123

# The data source the Mirror puts clients in front of. Pick one backend.
[backend]
type = sqlite
database = :memory:

# For PostgreSQL instead (needs psycopg installed), comment out the sqlite
# block above and use:
#
# [backend]
# type = postgres
# conninfo = host=127.0.0.1 port=5433 user=pyo password=pyo123 dbname=mirror

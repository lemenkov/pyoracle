[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoracle"
version = "1.10.1"
description = "Python module to interact with a proprietary database"
readme = "README.md"
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Peter Lemenkov", email = "lemenkov@gmail.com" },
]

dependencies = [
    "pycryptodome",
    # Supplies the IANA tz database for `zoneinfo` so named-region TIMESTAMP
    # WITH TIME ZONE values resolve where the OS ships no system zoneinfo
    # (e.g. Windows, slim containers). A no-op where system tzdata exists.
    "tzdata",
    # Arrow / DataFrame bulk fetch (#162): cursor.fetch_df_all/_batches return
    # a pyarrow.Table for fast hand-off to pandas / Polars / pyarrow.
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/lemenkov/pyoracle"

[tool.setuptools.packages.find]
include = ["oracle*"]

[tool.setuptools.package-data]
# PEP 561 marker so type checkers (mypy, pyright) treat pyoracle as typed.
oracle = ["py.typed"]

[tool.mypy]
python_version = "3.10"
files = ["oracle"]
# Runtime deps (pycryptodome, pyarrow) ship no stubs; treat them as Any.
ignore_missing_imports = true

# Type-check debt, cleaned up incrementally (#232): these modules still carry
# annotation gaps and are exempt from the gate until fixed one at a time. Every
# other module IS enforced, so the gate protects the already-clean surface and
# ratchets as modules are removed from this list.
[[tool.mypy.overrides]]
module = [
    "oracle.tns",
    "oracle.connection",
    "oracle.aconnection",
    "oracle.apool",
    "oracle.cursor",
    "oracle.acursor",
    "oracle.dbobject",
    "oracle.aq",
    "oracle.vector",
    "oracle.soda",
    "oracle.lob",
    "oracle.datatypes",
    "oracle.crypto",
]
ignore_errors = true

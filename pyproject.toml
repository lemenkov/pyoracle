[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seerdb"
version = "2.1.0"
description = "Python module to interact with a proprietary database"
readme = "README.md"
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Peter Lemenkov", email = "lemenkov@gmail.com" },
]

dependencies = [
    "pycryptodome",
    # Supplies the IANA tz database for `zoneinfo` so named-region TIMESTAMP
    # WITH TIME ZONE values resolve where the OS ships no system zoneinfo
    # (e.g. Windows, slim containers). A no-op where system tzdata exists.
    "tzdata",
    # Arrow / DataFrame bulk fetch (#162): cursor.fetch_df_all/_batches return
    # a pyarrow.Table for fast hand-off to pandas / Polars / pyarrow.
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/seerdb/seerdb"

[tool.setuptools.packages.find]
include = ["seerdb*"]
# The Mirror server (seerdb.server) is a development/reference component that
# ships in the repository but NOT in the published distribution — the released
# package is the client driver only (a pip-installable Oracle-wire *server* is a
# profile we keep off PyPI). seerdb/__init__.py imports it lazily so `import
# seerdb` still works without it; run the Mirror from a source checkout (#301).
exclude = ["seerdb.server*"]

[tool.setuptools.package-data]
# PEP 561 marker so type checkers (mypy, pyright) treat seerdb as typed.
seerdb = ["py.typed"]

[tool.mypy]
python_version = "3.10"
files = ["seerdb"]
# Runtime deps (pycryptodome, pyarrow) ship no stubs; treat them as Any.
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
# The codebase leans single-quoted; normalise to that rather than flipping ~1400
# strings to double.
quote-style = "single"

[tool.ruff.lint]
# Start focused, like the mypy rollout: real correctness (pyflakes) + import
# order; `ruff format` owns the cosmetic side. The opinionated families (SIM, B,
# UP, and the churnier pycodestyle rules) can be ratcheted in later.
select = ["F", "W", "I", "E9"]
# The wire code uses house-convention CamelCase locals and a few single-letter
# names; the naming rules (N*) are deliberately not selected.

name: Lint

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'REUSE.toml'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/dependabot.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'REUSE.toml'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/dependabot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check seerdb tests
      - run: ruff format --check seerdb tests

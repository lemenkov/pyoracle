name: Tests

on:
  push:
    branches: [master]
    # Docs-only changes don't affect the driver, so skip the (expensive, live-
    # Oracle) test runs when nothing outside these paths changed. A commit that
    # also touches code still runs — the filter only skips when every changed
    # file matches. (CI budget, #7)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ChangeLog'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'REUSE.toml'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/dependabot.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ChangeLog'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'REUSE.toml'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/dependabot.yml'

# Cancel a superseded run when a new commit is pushed to the same ref, so rapid
# pushes don't stack up and exhaust the Actions concurrency/usage budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Install the package so runtime deps (pycryptodome, tzdata) are present
      # for every offline module. The DB-backed integration tests skip
      # automatically without SEERDB_TEST_USER.
      - run: pip install .
      - run: >-
          python -m unittest -v
          tests.test_crypto
          tests.test_tns_decode
          tests.test_tns_encode
          tests.test_tns_types
          tests.test_api_conveniences
          tests.test_connection

  # Static type-check gate (#232). Enforces mypy on the already-clean modules;
  # the larger driver modules are exempt via [tool.mypy] overrides until cleaned
  # incrementally, so the list ratchets down over time.
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install . mypy
      - run: python -m mypy

  # Integration tests against a real Oracle server, run across three testbeds
  # (#28, #52): 11g (:1521/XE), 21c (:1521/XEPDB1, field version 16) and 23ai
  # Free (:1521/FREEPDB1, field version 17). fail-fast is off so a flake on one
  # DB doesn't cancel the others; a generous --shm-size keeps the memory-fragile
  # 21c/23ai containers from OOM-stalling under the suite.
  integration:
    name: Integration tests (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: "Oracle XE 11g"
            image: "gvenzl/oracle-xe:11-slim"
            service: "XE"
            field_version: "0"
          - name: "Oracle XE 21c"
            image: "gvenzl/oracle-xe:21-slim"
            service: "XEPDB1"
            field_version: "16"
          - name: "Oracle 23ai Free"
            image: "gvenzl/oracle-free:23-slim"
            service: "FREEPDB1"
            field_version: "17"
    services:
      oracle:
        image: ${{ matrix.db.image }}
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: pyo
          APP_USER_PASSWORD: pyo123
        ports:
          - 1521:1521
        # The gvenzl image ships healthcheck.sh; wait for first-boot setup
        # (slower on 21c) before the test step. --shm-size gives the 21c
        # instance enough shared memory to run the full suite without OOM.
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 90s
          --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Run integration suite against ${{ matrix.db.name }}
        env:
          SEERDB_TEST_USER: pyo
          SEERDB_TEST_PASSWORD: pyo123
          SEERDB_TEST_HOST: localhost
          SEERDB_TEST_PORT: "1521"
          SEERDB_TEST_SERVICE: ${{ matrix.db.service }}
          SEERDB_TEST_FIELD_VERSION: ${{ matrix.db.field_version }}
          # DBA login for the pre-SHA-2 verifier login test (#311): it forges a
          # throwaway 11g-only account. The gvenzl images set SYSTEM to
          # ORACLE_PASSWORD. Harmless on 11g (that test skips on a pre-12c server).
          SEERDB_TEST_ADMIN_USER: system
          SEERDB_TEST_ADMIN_PASSWORD: oracle
          # Pace logins under XE's logon-storm throttle (ORA-01013), and retry a
          # whole test that still trips it.
          SEERDB_TEST_CONNECT_DELAY: "0.25"
          SEERDB_TEST_THROTTLE_RETRIES: "4"
          SEERDB_TEST_THROTTLE_DELAY: "1.0"
        run: python -m unittest -v tests.test_integration

  # The same 11.2 integration suite, driven through the Mirror over a PostgreSQL
  # backend (examples/mirror_over_postgres.py): a real seerdb client talks to the
  # Mirror, which serves every statement from PostgreSQL via the dialect
  # translator. Regressions in the backend or the Mirror's thin path used to go
  # unnoticed because nothing ran the suite this way. PostgreSQL comes from the
  # repo's own image (orafce built from source), started as a container in the
  # job; the Mirror runs in the background of the test step so it is torn down
  # with it. The backend's own unit module runs here too — it needs psycopg and
  # a reachable PostgreSQL, so it is skipped everywhere else.
  mirror-postgres:
    name: Integration tests (Mirror over PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install . pytest "psycopg[binary]"
      - name: Build and start PostgreSQL with orafce
        run: |
          docker build -f examples/mirror-pg.Dockerfile -t mirror-pg .
          docker run -d --name mirror-pg -p 5433:5432 \
            -e POSTGRES_USER=pyo -e POSTGRES_PASSWORD=pyo123 -e POSTGRES_DB=mirror \
            mirror-pg
          # The image's first boot runs a temporary socket-only server for its init
          # scripts and shuts it down before the real one starts, so probe over
          # TCP, which only the real server answers. orafce is a hard requirement
          # of the backend, not a nice-to-have: prove the extension loads and its
          # functions resolve as part of the readiness check, or fail here.
          for i in $(seq 1 60); do
            if docker exec mirror-pg psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U pyo -d mirror \
                 -c "CREATE EXTENSION IF NOT EXISTS orafce" \
                 -c "SELECT oracle.nvl(NULL::text, 'orafce ok'), oracle.add_months(DATE '2026-01-31', 1)"; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL with orafce never became ready"; docker logs mirror-pg; exit 1
      - name: Run the backend unit module and the integration suite through the Mirror
        env:
          MIRROR_PG: "host=localhost port=5433 user=pyo password=pyo123 dbname=mirror"
          SEERDB_TEST_USER: pyo
          SEERDB_TEST_PASSWORD: pyo123
          SEERDB_TEST_HOST: 127.0.0.1
          SEERDB_TEST_PORT: "1521"
          SEERDB_TEST_SERVICE: XE
        run: |
          python -m pytest -q tests/test_postgres_backend.py
          # Run the Mirror from the checkout (the launcher lives in examples/, so
          # without this it would import whatever `pip install .` shipped).
          PYTHONPATH="$PWD" python examples/mirror_over_postgres.py "$MIRROR_PG" 1521 > mirror.log 2>&1 &
          MIRROR_PID=$!
          for i in $(seq 1 30); do
            python -c "import socket; socket.create_connection(('127.0.0.1', 1521), timeout=1).close()" 2>/dev/null && break
            sleep 1
          done
          if ! kill -0 "$MIRROR_PID" 2>/dev/null; then
            echo "the Mirror exited during startup"; cat mirror.log; exit 1
          fi
          status=0
          # pytest rather than unittest here, because this run has to skip a
          # group and unittest's -k takes a pattern, not an expression. The
          # step above already uses pytest, and so does
          # tools/run_mirror_suite.py, which is how this same run is done
          # locally.
          #
          # The skipped group is the one the Mirror cannot serve: a
          # RETURNING ... INTO statement writes no value for its server-filled
          # binds, and the Mirror's request parser reads a value for every
          # bind, so it desyncs before the backend sees anything. It also has
          # no way to send return data back. Both halves are issue #689; the
          # local runner skips the same group for the same reason. The pattern
          # covers every test that reaches such a statement, wherever it lives,
          # since they all die the same way. Drop this to verify that work.
          python -m pytest -q --tb=short tests/test_integration.py \
            -k "not returning" || status=$?
          kill "$MIRROR_PID" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then echo "--- mirror log ---"; tail -n 200 mirror.log; fi
          exit "$status"

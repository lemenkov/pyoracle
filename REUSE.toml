[[annotations]]
path = ["tests/fixtures/proxy_cert.pem", "tests/fixtures/proxy_key.pem"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
# Wallet mTLS fixture (#127), regenerated by tests/fixtures/make_wallet_fixture.py.
# Test-only certificates / keys / Oracle Net config; no inline SPDX tags possible.
path = ["tests/fixtures/wallet/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
# PEP 561 marker; conventionally empty so it carries no inline SPDX tag. Trivial
# (empty) file, so CC0-1.0 like the repo's other config.
path = ["seerdb/py.typed"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
# Captured ANO negotiation response from a real Oracle server (#437), test data.
path = ["tests/fixtures/ano_server_response.bin"]
precedence = "aggregate"
